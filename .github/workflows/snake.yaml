name: Generate contribution snake

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: paradigmajs
          outputs: |
            dist/github-snake.svg?color_snake=%230EA5E9&color_dots=%23ebedf0,%239dd9f3,%2359b7ed,%23267cc5,%23164780
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
