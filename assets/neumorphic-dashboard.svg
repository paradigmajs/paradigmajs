<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 290" role="img" aria-label="Animated neumorphic engineering dashboard with pulsing system signals">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf3fb"/><stop offset="1" stop-color="#dbe5f2"/></linearGradient><linearGradient id="accent"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><filter id="raised" x="-25%" y="-35%" width="150%" height="170%"><feDropShadow dx="-6" dy="-6" stdDeviation="7" flood-color="#fff" flood-opacity=".94"/><feDropShadow dx="7" dy="8" stdDeviation="8" flood-color="#94a3b8" flood-opacity=".35"/></filter><style>text{font-family:ui-monospace,Menlo,Consolas,monospace}.head{font-size:19px;fill:#243954;font-weight:700}.small{font-size:12px;fill:#65778e}.num{font-size:25px;fill:#2c4771;font-weight:700}.pulse{animation:pulse 2.5s ease-in-out infinite}.delayed{animation-delay:.8s}.later{animation-delay:1.6s}.travel{stroke-dasharray:8 11;animation:dash 10s linear infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-190}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="1040" height="290" rx="26" fill="url(#bg)"/><text x="35" y="44" class="head">ENGINEERING CONTROL PANEL</text><text x="35" y="66" class="small">ADAM / PARADIGMA • SYSTEMS ONLINE</text>
<rect x="35" y="90" width="302" height="145" rx="22" fill="#e4ecf6" filter="url(#raised)"/><text x="59" y="125" class="small">ARCHITECTURE</text><text x="59" y="163" class="num">DESIGN → SHIP</text><text x="59" y="195" class="small">PRODUCT-DRIVEN ENGINEERING</text><circle cx="303" cy="117" r="8" fill="#22c55e" class="pulse"/>
<rect x="369" y="90" width="302" height="145" rx="22" fill="#e4ecf6" filter="url(#raised)"/><text x="393" y="125" class="small">PRODUCT DEVELOPMENT</text><text x="393" y="163" class="num">WEB + MOBILE</text><text x="393" y="195" class="small">REACT • REACT NATIVE • NODE</text><circle cx="637" cy="117" r="8" fill="#3b82f6" class="pulse delayed"/>
<rect x="703" y="90" width="302" height="145" rx="22" fill="#e4ecf6" filter="url(#raised)"/><text x="727" y="125" class="small">BUSINESS SYSTEMS</text><text x="727" y="163" class="num">CRM + APIs</text><text x="727" y="195" class="small">INTEGRATIONS • AUTOMATION</text><circle cx="971" cy="117" r="8" fill="#8b5cf6" class="pulse later"/>
<path d="M35 261 H1005" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="travel"/><text x="520" y="281" fill="#7185a0" font-size="10" text-anchor="middle">DISCOVER • ARCHITECT • BUILD • DEPLOY • ITERATE</text></svg>